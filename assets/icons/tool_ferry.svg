<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Minimalist Bridge / Pontoon Ferry Crossing icon -->
  <!-- Two main vertical bridge towers / piers -->
  <rect x="13" y="14" width="3.5" height="20" rx="1" fill="currentColor"/>
  <rect x="31.5" y="14" width="3.5" height="20" rx="1" fill="currentColor"/>
  <!-- Suspension cables arching across -->
  <path d="M 6 25 Q 14.7 15 24 23 Q 33.3 15 42 25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vertical suspender lines -->
  <line x1="19" y1="21" x2="19" y2="28" stroke="currentColor" stroke-width="1.8"/>
  <line x1="24" y1="23" x2="24" y2="28" stroke="currentColor" stroke-width="1.8"/>
  <line x1="29" y1="21" x2="29" y2="28" stroke="currentColor" stroke-width="1.8"/>
  <!-- Horizontal bridge / ferry deck -->
  <rect x="6" y="27" width="36" height="3.5" rx="1.5" fill="currentColor"/>
  <!-- Water waves underneath -->
  <path d="M 8 35 Q 12 33 16 35 Q 20 37 24 35 Q 28 33 32 35 Q 36 37 40 35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
</svg>
